name: Deploy to web server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP sync site files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          # Use Ghana account credentials by default; override for other deployments
          username: ${{ secrets.FTP_USERNAME_GHANA || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD_GHANA || secrets.FTP_PASSWORD }}
          # Use "ftps" (encrypted) whenever the host supports it; change to
          # "ftp" only if the server cannot do FTPS.
          protocol: ftps
          # Remote directory to deploy into. Set the FTP_SERVER_DIR repository
          # variable (Settings -> Secrets and variables -> Actions -> Variables),
          # e.g. "public_html/" — it must end with a slash.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Development-only files that must never reach the live server.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            .mcp.json
            SETUP.md
            database.sql
            migrations/**
